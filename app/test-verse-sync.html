<!DOCTYPE html>
<html>
<head>
<title>PAT Bible 구절 동기화 테스트</title>
<style>
  body { font-family: monospace; background: #1a1a2e; color: #e8e8e8; padding: 20px; }
  .log { background: #16213e; border: 1px solid #2a3a5e; padding: 10px; margin: 10px 0; border-radius: 8px; max-height: 400px; overflow-y: auto; }
  .success { color: #16c784; }
  .error { color: #ff5d5d; }
  button { padding: 10px 20px; background: #16c784; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 5px; }
  input { padding: 10px; margin: 5px; border-radius: 8px; border: 1px solid #2a3a5e; background: #16213e; color: #e8e8e8; }
</style>
</head>
<body>

<h1>🧪 PAT Bible 구절 동기화 테스트</h1>

<div class="log" id="log"></div>

<button onclick="testFlow()">테스트 실행</button>
<button onclick="clearLog()">로그 지우기</button>

<h3>테스트 정보:</h3>
<label>교회 코드: <input type="text" id="churchCode" value="11111" style="width:100px"></label>
<label>참고: <input type="text" id="ref" value="로마서 1:16" style="width:300px"></label>
<label>본문: <input type="text" id="text" value="내가 복음을 부끄러워하지 아니하노라" style="width:400px"></label>

<script src="firebase-config.js"></script>
<script src="firebase-db.js"></script>
<script src="js/app-core.js"></script>
<script src="js/verse.js"></script>

<script>
const logEl = document.getElementById('log');

function log(msg, type = 'info') {
  const ts = new Date().toLocaleTimeString();
  const color = type === 'success' ? '#16c784' : type === 'error' ? '#ff5d5d' : '#8b93a7';
  const html = `<div style="color:${color}">[${ts}] ${msg}</div>`;
  logEl.innerHTML += html;
  logEl.scrollTop = logEl.scrollHeight;
}

function clearLog() {
  logEl.innerHTML = '';
}

async function testFlow() {
  clearLog();
  log('=== 구절 동기화 테스트 시작 ===', 'info');
  
  const churchCode = document.getElementById('churchCode').value;
  const ref = document.getElementById('ref').value;
  const text = document.getElementById('text').value;
  
  log(`교회 코드: ${churchCode}`, 'info');
  log(`참고: ${ref}`, 'info');
  log(`본문: ${text.substring(0, 30)}...`, 'info');
  
  // 1단계: Firebase 준비 확인
  log('1️⃣ Firebase 상태 확인...', 'info');
  if (!window.PAT_DB) {
    log('❌ PAT_DB 모듈 로드 안 됨', 'error');
    return;
  }
  log('✅ PAT_DB 모듈 준비됨', 'success');
  
  if (!PAT_DB.ready()) {
    log('❌ Firebase 연결 안 됨 (FIREBASE_READY=false)', 'error');
    return;
  }
  log('✅ Firebase 연결됨', 'success');
  
  // 2단계: Admin Token 확인
  log('2️⃣ Admin Token 확인...', 'info');
  const adminToken = window.FIREBASE_CONFIG?.adminToken || localStorage.getItem('pat_admin_token');
  if (!adminToken) {
    log('⚠️  Admin Token 없음 (saveVerse 실패 예상)', 'error');
  } else {
    log('✅ Admin Token 존재: ' + adminToken.substring(0, 20) + '...', 'success');
  }
  
  // 3단계: saveVerse 호출
  log('3️⃣ saveVerse 호출 중...', 'info');
  const ok = await PAT_DB.saveVerse(churchCode, { ref, text, weekOf: '테스트' });
  if (ok) {
    log('✅ Firebase 저장 성공!', 'success');
  } else {
    log('❌ Firebase 저장 실패', 'error');
  }
  
  // 4단계: 구절 폴링 테스트
  log('4️⃣ 구절 폴링 테스트 (5초 대기)...', 'info');
  
  let detected = false;
  const testCallback = (verse) => {
    log(`✅ 구절 감지됨: ${verse.ref} (Hash 비교)`, 'success');
    detected = true;
  };
  
  // subscribeVerse 호출
  if (PAT_DB.subscribeVerse) {
    PAT_DB.subscribeVerse(churchCode, testCallback);
    log('✅ 폴링 구독 시작 (5초 간격)', 'success');
  }
  
  // 5초 대기
  await new Promise(r => setTimeout(r, 6000));
  
  if (detected) {
    log('✅ 테스트 완료 — 동기화 정상!', 'success');
  } else {
    log('⚠️  테스트 완료 — 5초 내 감지 못 함 (폴링 확인 필요)', 'error');
  }
}

// 앱 초기화
window.addEventListener('load', () => {
  log('📍 페이지 로드됨', 'info');
  log(`Firebase READY: ${window.FIREBASE_READY}`, window.FIREBASE_READY ? 'success' : 'error');
  log(`Admin Token: ${window.FIREBASE_CONFIG?.adminToken ? '있음' : '없음'}`, 'info');
});
</script>

</body>
</html>
