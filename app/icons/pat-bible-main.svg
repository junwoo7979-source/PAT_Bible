<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
        </linearGradient>
      </defs>
      <rect width="256" height="256" rx="60" fill="url(#grad)"/>
      
      <!-- 성경책 -->
      <g transform="translate(50, 60)">
        <rect x="0" y="0" width="90" height="70" rx="4" fill="#1e3a8a"/>
        <rect x="0" y="0" width="5" height="70" fill="#0f172a"/>
        <line x1="15" y1="20" x2="70" y2="20" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
        <line x1="15" y1="28" x2="65" y2="28" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
        <line x1="15" y1="36" x2="60" y2="36" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
      </g>
      
      <!-- 십자가 -->
      <g transform="translate(140, 80)">
        <rect x="-2" y="-12" width="4" height="24" fill="#fbbf24" rx="2"/>
        <rect x="-12" y="-2" width="24" height="4" fill="#fbbf24" rx="2"/>
      </g>
      
      <!-- 가족 -->
      <text x="160" y="180" font-size="45" text-anchor="middle">👨‍👩‍👧</text>
