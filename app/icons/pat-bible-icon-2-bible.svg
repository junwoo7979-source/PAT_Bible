    <!-- 말씀 라인들 -->
    <line x1="20" y1="120" x2="100" y2="120" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="20" y1="135" x2="95" y2="135" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
