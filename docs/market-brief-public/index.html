<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>오늘의 안부</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 20px; display: grid; place-items: center; font-family: system-ui, sans-serif; color: #f8fafc; background: #0f172a; }
    article { width: min(560px, 100%); padding: 36px 28px; border: 1px solid #334155; border-radius: 26px; background: radial-gradient(circle at 85% 10%, #0f766e, transparent 38%), #1e293b; box-shadow: 0 24px 60px rgba(0,0,0,.3); }
    .tag { color: #6ee7b7; font-weight: 800; }
    h1 { margin: 14px 0 20px; font-size: clamp(36px, 12vw, 58px); line-height: 1.08; }
    p { margin: 0; color: #dbeafe; font-size: 21px; line-height: 1.8; }
  </style>
</head>
<body>
  <article>
    <div class="tag">TODAY'S MESSAGE</div>
    <h1>오늘의 안부</h1>
    <p>오늘도 건강하고 평안한 하루 보내세요.<br>좋은 일과 따뜻한 웃음이 함께하기를 바랍니다.</p>
  </article>
</body>
</html>
